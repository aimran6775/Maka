<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maka</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: #0b1410; --text: #e8e4d8; --muted: #9aa89c; --accent: #8fd18a; --error: #ff7b7b; --panel: rgba(18, 28, 22, 0.94); --border: #2e4a38; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  main { max-width: 560px; padding: 24px 28px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  h1 { font-size: 18px; margin: 0 0 8px; color: var(--accent); letter-spacing: 0.08em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .error { color: var(--error); white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>MAKA</h1>
  <p id="line">Starting the sidecar…</p>
  <p id="detail" class="muted">The park opens as soon as the sidecar answers. This page shows only what the shell knows.</p>
  <p id="error" class="error" hidden></p>
</main>
<script>
  // The shell navigates here with #error=<message> when the sidecar could not start or
  // kept dying; otherwise the window is navigated to the park and this page is gone.
  const params = new URLSearchParams(location.hash.slice(1));
  const error = params.get('error');
  const log = params.get('log');
  if (error) {
    document.getElementById('line').textContent = 'The sidecar is not running.';
    document.getElementById('detail').textContent = log ? `Sidecar log: ${log}` : '';
    const e = document.getElementById('error');
    e.textContent = error;
    e.hidden = false;
  }
</script>
</body>
</html>
