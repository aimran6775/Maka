<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Ranger is driving this Mac</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1f16; color: #f1e9d2; font: 600 14px/44px system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 44px; border: 2px solid #ffb347; border-radius: 8px; box-sizing: border-box; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ffb347; animation: blink 1s infinite alternate; }
  @keyframes blink { from { opacity: 1 } to { opacity: 0.3 } }
  .key { font-family: ui-monospace, Menlo, monospace; background: #333a2c; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="bar"><span class="dot"></span><span>A Maka Ranger is driving this Mac</span><span class="key">⌃⌥⌘H</span><span>halts it</span></div>
</body>
</html>
